name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels that pull request's runs still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The runner image and the Xcode version are pinned here and nowhere else. The Xcode must
# ship the SDK the app deploys to (iOS 26.4) and the image must carry its simulator
# runtime. `runs-on` cannot read `env`, so the jobs alias the image through its anchor.
env:
  MACOS_RUNNER: &macos_runner macos-26
  XCODE_VERSION: "26.4"

# Benchmarks and snapshot tests are not run on CI: their budgets and reference images
# belong to the developer's Mac.
jobs:
  unit-tests:
    name: Unit tests
    runs-on: *macos_runner
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Choose where tools/check writes its results
        run: |
          mkdir -p "$RUNNER_TEMP/check-results"
          echo "GROSH_CHECK_RESULT_DIR=$RUNNER_TEMP/check-results" >> "$GITHUB_ENV"

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          xcode_app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$xcode_app" ]; then
            echo "::error::Xcode ${XCODE_VERSION} is not on this runner image. Set XCODE_VERSION to one of the installed versions listed in this step's log."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select --switch "$xcode_app/Contents/Developer"

      - name: Show Xcode and available simulators
        run: |
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          sw_vers
          xcode-select --print-path
          xcodebuild -version
          xcrun simctl list devices available

      # Keyed on the project file and Package.resolved (which exists once the project has
      # Swift packages). A change to either saves a new cache, seeded from the latest one.
      - name: Cache SwiftPM packages and DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-${{ github.job }}-${{ hashFiles('Grosh.xcodeproj/project.pbxproj', '**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-${{ github.job }}-

      - name: Run the unit tests
        run: tools/check

      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}-results
          path: ${{ env.GROSH_CHECK_RESULT_DIR }}
          retention-days: 14

  # The repo is public, so macOS runners are free. If it goes private, macOS minutes count
  # ten times against the allowance: revisit running this job on every pull request.
  ui-tests:
    name: UI tests
    runs-on: *macos_runner
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Choose where tools/check writes its results
        run: |
          mkdir -p "$RUNNER_TEMP/check-results"
          echo "GROSH_CHECK_RESULT_DIR=$RUNNER_TEMP/check-results" >> "$GITHUB_ENV"

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          xcode_app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$xcode_app" ]; then
            echo "::error::Xcode ${XCODE_VERSION} is not on this runner image. Set XCODE_VERSION to one of the installed versions listed in this step's log."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select --switch "$xcode_app/Contents/Developer"

      - name: Show Xcode and available simulators
        run: |
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          sw_vers
          xcode-select --print-path
          xcodebuild -version
          xcrun simctl list devices available

      # Keyed on the project file and Package.resolved (which exists once the project has
      # Swift packages). A change to either saves a new cache, seeded from the latest one.
      - name: Cache SwiftPM packages and DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-${{ github.job }}-${{ hashFiles('Grosh.xcodeproj/project.pbxproj', '**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-${{ github.job }}-

      - name: Run the UI tests and check the app's logs
        run: tools/check --ui

      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}-results
          path: ${{ env.GROSH_CHECK_RESULT_DIR }}
          retention-days: 14
