name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels that pull request's runs still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Xcode must ship the SDK the app deploys to (iOS 26.4), and the runner image below must carry
# that Xcode and its simulator runtime. Check both against GitHub's runner image list before relying on them.
env:
  XCODE_VERSION: "26.4"

# Benchmarks and snapshot tests are not run on CI: their budgets and reference images belong to
# the developer's Mac.
jobs:
  # Which of the jobs below a pull request needs, from the files it changes. A push to main runs them all.
  # The tests run unless every file is one the app does not build from: docs, Markdown, agent settings, the
  # tools' own tests. The Tools job runs when tools/, the hooks or the workflow change.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.paths.outputs.app }}
      tools: ${{ steps.paths.outputs.tools }}
    steps:
      # A pull request checks out its merge commit, whose first parent is the base branch.
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Sort the changed files
        id: paths
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            printf 'app=true\ntools=true\n' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          printf '%s\n' "$changed"
          app=false
          tools=false
          grep -qvE '^(docs/|\.claude/|tools/tests/|tools/test_[^/]*\.py$|LICENSE$|skills-lock\.json$)|\.md$' <<<"$changed" && app=true
          grep -qE '^(tools/|\.claude/hooks/|\.github/)' <<<"$changed" && tools=true
          printf 'app=%s\ntools=%s\n' "$app" "$tools" | tee -a "$GITHUB_OUTPUT"

  checks:
    # One check per entry, so the unit tests and the UI tests each show on the pull request.
    # A failure in one does not stop the other.
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Unit tests
            id: unit
            command: tools/check
          # Only the UI tests: the unit tests have their own job.
          - name: UI tests
            id: ui
            command: tools/check --ui --only GroshUITests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select the pinned Xcode
        run: |
          xcode_app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$xcode_app" ]; then
            echo "::error::Xcode ${XCODE_VERSION} is not on this runner image. Set XCODE_VERSION to one of the versions listed below."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select --switch "$xcode_app/Contents/Developer"

      - name: Show the Xcode and the simulators in use
        run: |
          sw_vers
          xcodebuild -version
          xcrun simctl list devices available

      # Keyed on the project file and Package.resolved, which pins the Swift packages.
      - name: Cache SwiftPM packages and DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('Grosh.xcodeproj/project.pbxproj', '**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-

      - name: Run the checks
        env:
          GROSH_CHECK_RESULT_DIR: ${{ runner.temp }}/check-results
          # Only TEST_RUNNER_ variables reach the tests, without the prefix: this is how the snapshot tests see CI.
          TEST_RUNNER_CI: 'true'
        run: |
          mkdir -p "$GROSH_CHECK_RESULT_DIR"
          ${{ matrix.command }}

      - name: Upload the results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-results
          path: ${{ runner.temp }}/check-results
          retention-days: 14

  # The tools' own tests: tools/check and the Stop hook against stand-ins, and tools/check-logs on canned logs. They
  # need no Xcode or simulator, so they report in a minute. On macOS, where the tools run.
  tools:
    name: Tools
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test tools/check
        run: tools/tests/check/run.sh

      - name: Test the Stop hook
        run: tools/tests/run-checks/run.sh

      - name: Test tools/check-logs
        run: python3 -B -m unittest discover -s tools
